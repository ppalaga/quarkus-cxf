quarkus.oidc.application-type = service
quarkus.oidc.client-id = quarkus-cxf-oidc
quarkus.oidc.credentials.secret = secret

# Require Keycloak Dev Services for these tests.
quarkus.oidc.devservices.enabled = false
quarkus.keycloak.devservices.users.alice = alice
quarkus.keycloak.devservices.roles.alice = italian
quarkus.keycloak.devservices.users.bob = bob
quarkus.keycloak.devservices.roles.bob = user

quarkus.cxf.endpoint."/hello".implementor = io.quarkiverse.cxf.it.auth.oidc.HelloServiceImpl


# Generated sync and callback APIs, with no OIDC annotations on the generated SEI.
quarkus.cxf.codegen.wsdl2java.oidc.includes = wsdl/oidc-echo.wsdl
quarkus.cxf.codegen.wsdl2java.oidc.additional-params = -p,urn:quarkus-cxf:oidc:echo=io.quarkiverse.cxf.it.auth.oidc.client.model,-b,src/main/resources/wsdl/oidc-echo-bindings.xml
quarkus.cxf.endpoint."/oidc-relay".implementor = io.quarkiverse.cxf.it.auth.oidc.client.OidcRelayService
# T-009: this is a build-time setting, so it must also be present when producing the native executable.
quarkus.cxf.http-conduit-factory = URLConnectionHTTPConduitFactory

# The local test resource overrides these runtime addresses in JVM and native runs.
oidc.fixture.http = http://localhost:1
oidc.fixture.https = https://localhost:1
